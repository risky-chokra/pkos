# pk's OS build config (shell-source kiya jaata hai). Naam/label/defaults yahi se badlo.
# shellcheck shell=sh

OS_NAME="pk's OS"
OS_VERSION=1.0
OS_ID=pkos
ISO_LABEL=PKOS
HOSTNAME=pk

# live session ka default user (live me autologin on hota hai; password: pk)
LIVE_USER=root
LIVE_PASS=pk

# squashfs compression: auto | zstd | xz | lz4 | gzip
SQUASH_COMP=auto

# initramfs me kaun-kaun se kernel modules jayenge (dependency order build khud nikalta hai)
INIT_MODULES=init

# kernel image + uska modules dir. khali = host ka sabse naya /boot/vmlinuz-*
PK_KERNEL=${PK_KERNEL:-}
PK_MODULES=${PK_MODULES:-}

# grub ke default live boot args
KERNEL_CMDLINE=${KERNEL_CMDLINE:-quiet loglevel=3}

export OS_NAME OS_VERSION OS_ID ISO_LABEL HOSTNAME LIVE_USER LIVE_PASS
export SQUASH_COMP INIT_MODULES KERNEL_CMDLINE
